plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}
def internalCandidate = providers.gradleProperty("nativeInternalCandidate").orNull == "true"
def signingPath = System.getenv("SEARCHBEFORE_KEYSTORE_PATH")
def signingAlias = System.getenv("SEARCHBEFORE_KEY_ALIAS")
def signingStorePassword = System.getenv("SEARCHBEFORE_STORE_PASSWORD")
def signingKeyPassword = System.getenv("SEARCHBEFORE_KEY_PASSWORD")
android {
    namespace "tw.searchbefore.nativeapp"
    compileSdk 36
    defaultConfig {
        applicationId "tw.searchbefore.app"
        // Keep existing Play automatic protection enabled (requires API 24+).
        minSdk 24
        targetSdk 36
        // Production-shaped candidate; distribution still requires the explicit signing gate.
        // Play highest observed code was 9 on 2026-09-26. This does not authorize rollout.
        versionCode 10
        versionName "1.1.4"
        resValue "string", "app_name", "噴前查"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (internalCandidate && signingPath && signingAlias && signingStorePassword && signingKeyPassword) {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".nativepreview"
            versionNameSuffix "-preview"
            resValue "string", "app_name", "噴前查・原生預覽"
        }
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    buildFeatures { compose true; buildConfig true }
    lint { warningsAsErrors true }
    sourceSets.main.res.srcDir(layout.buildDirectory.dir("generated/branding/res"))
    sourceSets.debug.res.srcDir(layout.buildDirectory.dir("generated/firebase/res"))
    sourceSets.release.res.srcDir(layout.buildDirectory.dir("generated/firebase-production/res"))
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = "17" }
}
dependencies {
    implementation platform("androidx.compose:compose-bom:2025.08.01")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2"
    implementation platform("com.google.firebase:firebase-bom:34.19.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    androidTestImplementation platform("androidx.compose:compose-bom:2025.08.01")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
tasks.register("checkNativeCatalog") {
    doLast {
        if (!file("src/main/assets/catalog.json").exists()) {
            throw new GradleException("Run node scripts/export-native-catalog.cjs first")
        }
    }
}
tasks.register("nativeBranding", Copy) {
    from(rootProject.file("../brand-logo-transparent.png"))
    into(layout.buildDirectory.dir("generated/branding/res/drawable-nodpi"))
    rename { "native_logo.png" }
}
tasks.named("preBuild").configure { dependsOn("checkNativeCatalog", "nativeBranding") }
apply from: rootProject.file("gradle/firebase-config.gradle")
apply from: rootProject.file("gradle/firebase-config-tests.gradle")
def registerNativeFirebase = { String taskName, String configName, String outputDir, boolean production ->
tasks.register(taskName) {
    def source = rootProject.file(configName)
    inputs.files(source.exists() ? [source] : [])
    inputs.property("production", production)
    outputs.dir(layout.buildDirectory.dir(outputDir))
    // Recheck the identity every time; a stale generated resource is not acceptance.
    outputs.upToDateWhen { false }
    doLast {
        if (production && !source.exists()) throw new GradleException("Missing firebase-production.json; preview config cannot substitute for production")
        def output = layout.buildDirectory.file("${outputDir}/values/firebase.xml").get().asFile
        output.parentFile.mkdirs()
        def values = [:]
        if (source.exists()) {
            def config
            try { config = new groovy.json.JsonSlurper().parse(source) }
            catch (Exception ignored) { throw new GradleException("Native Firebase configuration is unreadable or invalid JSON; contents are not logged") }
            values = nativeFirebaseValues(config, production)
        }
        def xml = new StringWriter()
        // FirebaseOptions.fromResource reads project_id dynamically; keep the SDK resource explicitly.
        def attributes = ['xmlns:tools': 'http://schemas.android.com/tools']
        if (values) attributes['tools:keep'] = '@string/project_id'
        new groovy.xml.MarkupBuilder(xml).resources(attributes) {
            values.each { key, value -> string(name: key, translatable: "false", value) }
        }
        output.setText(xml.toString(), "UTF-8")
    }
}
}
registerNativeFirebase("nativeFirebase", "firebase-preview.json", "generated/firebase/res", false)
registerNativeFirebase("nativeFirebaseProduction", "firebase-production.json", "generated/firebase-production/res", true)
tasks.configureEach {
    if (name == "preDebugBuild") dependsOn("nativeFirebase", "checkNativeFirebaseConfig")
    if (name == "preReleaseBuild") dependsOn("nativeFirebaseProduction", "checkNativeFirebaseConfig")
}
// Default release builds remain blocked. Explicit candidate builds do NOT authorize production rollout.
// Play track selection is a separate Console action; this is not a technical track restriction on the AAB.
tasks.configureEach {
    if (name == "preReleaseBuild") doFirst {
        if (!internalCandidate) throw new GradleException("Native release blocked: use the explicit internal-candidate script; production acceptance remains incomplete")
        if (!signingPath || !signingAlias || !signingStorePassword || !signingKeyPassword) {
            throw new GradleException("Internal candidate requires the existing upload signing identity")
        }
        try {
            def keyStore = java.security.KeyStore.getInstance(file(signingPath), signingStorePassword.toCharArray())
            def certificate = keyStore.getCertificate(signingAlias)
            def digest = java.security.MessageDigest.getInstance("SHA-256").digest(certificate.encoded).encodeHex().toString()
            if (digest != "d749133d6c22aabb0e48654a424652f45dbf9220c2c586813a9347cda7bf2fbe") {
                throw new IllegalArgumentException("identity mismatch")
            }
        } catch (Exception ignored) {
            throw new GradleException("Internal candidate upload signing identity check failed; key details are not logged")
        }
    }
}
