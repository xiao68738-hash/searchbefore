plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}
android {
    namespace "tw.searchbefore.nativeapp"
    compileSdk 36
    defaultConfig {
        applicationId "tw.searchbefore.app"
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName "1.1.0-native-preview"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug { applicationIdSuffix ".nativepreview" }
        release { minifyEnabled false }
    }
    buildFeatures { compose true }
    lint { warningsAsErrors true }
    sourceSets.main.res.srcDir(layout.buildDirectory.dir("generated/branding/res"))
    sourceSets.debug.res.srcDir(layout.buildDirectory.dir("generated/firebase/res"))
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = "17" }
}
dependencies {
    implementation platform("androidx.compose:compose-bom:2025.08.01")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2"
    implementation platform("com.google.firebase:firebase-bom:34.19.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    androidTestImplementation platform("androidx.compose:compose-bom:2025.08.01")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
tasks.register("checkNativeCatalog") {
    doLast {
        if (!file("src/main/assets/catalog.json").exists()) {
            throw new GradleException("Run node scripts/export-native-catalog.cjs first")
        }
    }
}
tasks.register("nativeBranding", Copy) {
    from(rootProject.file("../brand-logo-transparent.png"))
    into(layout.buildDirectory.dir("generated/branding/res/drawable-nodpi"))
    rename { "native_logo.png" }
}
tasks.named("preBuild").configure { dependsOn("checkNativeCatalog", "nativeBranding") }
tasks.register("nativeFirebase") {
    def source = rootProject.file("firebase-preview.json")
    inputs.files(source.exists() ? [source] : [])
    outputs.dir(layout.buildDirectory.dir("generated/firebase/res"))
    doLast {
        def output = layout.buildDirectory.file("generated/firebase/res/values/firebase.xml").get().asFile
        output.parentFile.mkdirs()
        def values = [:]
        if (source.exists()) {
            def config = new groovy.json.JsonSlurper().parse(source)
            if (config.project_info.project_id != "searchbefore-4648b") throw new GradleException("Wrong Firebase project")
            def client = config.client.find { it.client_info.android_client_info.package_name == "tw.searchbefore.app.nativepreview" }
            if (!client) throw new GradleException("Missing native preview Firebase client")
            def webClient = client.oauth_client.find { it.client_type == 3 }
            if (!webClient) throw new GradleException("Missing Google OAuth web client; verify Android SHA configuration")
            values = [google_app_id: client.client_info.mobilesdk_app_id, google_api_key: client.api_key[0].current_key,
                project_id: config.project_info.project_id, gcm_defaultSenderId: config.project_info.project_number,
                default_web_client_id: webClient.client_id]
        }
        def xml = new StringWriter()
        // FirebaseOptions.fromResource reads project_id dynamically; keep the SDK resource explicitly.
        def attributes = ['xmlns:tools': 'http://schemas.android.com/tools']
        if (values) attributes['tools:keep'] = '@string/project_id'
        new groovy.xml.MarkupBuilder(xml).resources(attributes) {
            values.each { key, value -> string(name: key, translatable: "false", value) }
        }
        output.setText(xml.toString(), "UTF-8")
    }
}
tasks.configureEach { if (name == "preDebugBuild") dependsOn("nativeFirebase") }
// Preview cannot accidentally be promoted as the production replacement.
tasks.configureEach {
    if (name == "preReleaseBuild") doFirst {
        throw new GradleException("Native release blocked: Google login/cloud sync and migration acceptance remain incomplete. See android-native/README.md")
    }
}
