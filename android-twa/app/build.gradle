plugins {
    id "com.android.application"
}

def signingPath = System.getenv("SEARCHBEFORE_KEYSTORE_PATH")
def signingAlias = System.getenv("SEARCHBEFORE_KEY_ALIAS")
def signingStorePassword = System.getenv("SEARCHBEFORE_STORE_PASSWORD")
def signingKeyPassword = System.getenv("SEARCHBEFORE_KEY_PASSWORD")

android {
    namespace "tw.searchbefore.app"
    compileSdk 36

    defaultConfig {
        applicationId "tw.searchbefore.app"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "1.0.1.0"
    }

    signingConfigs {
        release {
            if (signingPath && signingAlias && signingStorePassword && signingKeyPassword) {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.6.2"
}
